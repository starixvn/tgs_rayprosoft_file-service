apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "file-service.fullname" . }}
  annotations:
    secret.reloader.stakater.com/reload: "tgs-connections"
    configmap.reloader.stakater.com/reload: "configmap-{{ include "file-service.fullname" . }}"
  labels:
    {{- include "file-service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "file-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "file-service.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: OTEL_SERVICE_NAME
              value: File-Service({{ .Release.Namespace }})
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: ConnectionStrings__File
              valueFrom:
                secretKeyRef:
                  name: tgs-connections
                  key: mongo-file
            - name: ConnectionStrings__Nats
              valueFrom:
                secretKeyRef:
                  name: tgs-connections
                  key: nats
            - name: AWS__AccessKeyId
              valueFrom:
                secretKeyRef:
                  name: tgs-connections
                  key: aws-accessKeyId
            - name: AWS__SecretAccessKey
              valueFrom:
                secretKeyRef:
                  name: tgs-connections
                  key: aws-secretAccessKey
            - name: AWS__Region
              valueFrom:
                secretKeyRef:
                  name: tgs-connections
                  key: aws-region
            - name: AWS__UseHttp
              valueFrom:
                secretKeyRef:
                  name: tgs-connections
                  key: aws-useHttp
            - name: AWS__Public__ExternalServiceUrl
              valueFrom:
                secretKeyRef:
                  name: tgs-connections
                  key: aws-public-externalServiceUrl
            - name: AWS__Public__ServiceUrl
              valueFrom:
                secretKeyRef:
                  name: tgs-connections
                  key: aws-public-serviceUrl
            - name: AWS__Public__Bucket
              valueFrom:
                secretKeyRef:
                  name: tgs-connections
                  key: aws-public-bucket
            - name: AWS__Private__ExternalServiceUrl
              valueFrom:
                secretKeyRef:
                  name: tgs-connections
                  key: aws-private-externalServiceUrl
            - name: AWS__Private__ServiceUrl
              valueFrom:
                secretKeyRef:
                  name: tgs-connections
                  key: aws-private-serviceUrl
            - name: AWS__Private__Bucket
              valueFrom:
                secretKeyRef:
                  name: tgs-connections
                  key: aws-private-bucket
          volumeMounts:
            - mountPath: /app/appsettings.Production.json
              name: appsettings
              readOnly: true
              subPath: appsettings.json
            {{- if .Values.mountMongoCert }}
            - mountPath: /etc/ssl/certs/rds-combined-ca-bundle.pem
              name: rds-combined-ca-bundle
              readOnly: true
              subPath: rds-combined-ca-bundle.pem
            {{- end }}
          livenessProbe:
            httpGet:
              path: /fs/health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /fs/health
              port: 80
            initialDelaySeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: appsettings
          configMap:
            name: configmap-{{ include "file-service.fullname" . }}
        {{- if .Values.mountMongoCert }}
        - name: rds-combined-ca-bundle
          secret:
            secertName: rds-combined-ca-bundle
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
