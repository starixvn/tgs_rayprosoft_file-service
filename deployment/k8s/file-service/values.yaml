# Default values for file-service.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: registry.gitlab.com/rayprosoft/turnkey-gaming-system/file-service
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "dev"

imagePullSecrets:
  - name: registry-credentials
nameOverride: "file-service"
fullnameOverride: "file-service"

connectionStrings:
  file: mongodb://admin:abcd1234@192.168.50.111/filedb?retryWrites=true&w=majority&authSource=admin

nats:
  urls: nats://nats-client:4222
  
aws: 
  accessKeyId: "test"
  secretAccessKey: "test"
  region: "ap-east-1"
  public: 
    externalUrl: "https://localstack.tgsdev.gq"
    serviceUrl: "http://localstack.default:4566"
    bucket: "tgs-project"
  private:
    externalUrl: "https://localstack.tgsdev.gq"
    serviceUrl: "http://localstack.default:4566"
    bucket: "tgs-secret"

mountMongoCert: false
    
podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext:
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  runAsUser: 0
  runAsGroup: 0

service:
  type: ClusterIP
  port: 80

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
