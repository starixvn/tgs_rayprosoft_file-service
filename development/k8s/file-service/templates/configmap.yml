apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "file-service.fullname" . }}
  namespace: {{ .Values.namespace }}
data:
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "Information",
          "Microsoft": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      },
      "AllowedHosts": "*",
      "DatabaseSettings": {
        "ConnectionString": "{{ .Values.connectionStrings.mongo}}",
      },
      "NatsSetting": {
        "Urls": "{{ .Values.nats.urls }}",
        "ConnectTimeoutMs": 2000,
        "PingInterval": 5000,
        "PingMaxOutStanding": 3,
        "SubscriptionBatchSize": 128
      },
      "FileSetting": {
        "Path": "UploadImages",
        "FileSizeLimit": 2097152
      },
      "AWS": {
        "AccessKeyId": "{{ .Values.aws.accessKeyId}}",
        "SecretAccessKey": "{{ .Values.aws.secretAccessKey}}",
        "Region": "{{ .Values.aws.region}}",
        "UseHttp": true,
        "Project": {
          "ExternalServiceUrl": "{{ .Values.aws.public.externalUrl}}",
          "ServiceUrl": "{{ .Values.aws.public.serviceUrl}}",
          "Bucket": "{{ .Values.aws.public.bucket}}"
        },
        "Secret": {
          "ExternalServiceUrl": "{{ .Values.aws.private.externalUrl}}",
          "ServiceUrl": "{{ .Values.aws.private.serviceUrl}}",
          "Bucket": "{{ .Values.aws.private.bucket}}"
        }
      }
    }